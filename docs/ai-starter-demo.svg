<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="806" viewBox="0 0 1100 806" role="img" aria-labelledby="title description">
<title id="title">AI Starter: verification of a copied Python service template</title>
<desc id="description">Real local run on Python 3.12.14. The tracked template files were staged in a temporary workspace, copied with cp, then checked with uv sync, Ruff lint, Ruff format checking and pytest. All commands exited zero. Four tests passed, including the secret scan. Output excerpts omit installation details and pytest metadata. This does not evaluate model response quality.</desc>
<rect width="1100" height="806" rx="16" fill="#0f172a"/>
<text x="32" y="44" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="600">AI Starter · verify a copied template</text>
<text x="32" y="78" fill="#94a3b8" font-family="sans-serif" font-size="16">Actual local output excerpts · Python 3.12.14 · macOS</text>
<path d="M32 100 H1068" stroke="#334155"/>
<text x="32" y="140" fill="#f8fafc" font-family="monospace" font-size="16" xml:space="preserve">$ cp -R templates/ai-python-service ../ai-service-demo</text>
<text x="32" y="168" fill="#94a3b8" font-family="monospace" font-size="16" xml:space="preserve">Working directory: temporary ai-service-demo</text>
<text x="32" y="196" fill="#cbd5e1" font-family="monospace" font-size="16" xml:space="preserve"></text>
<text x="32" y="224" fill="#f8fafc" font-family="monospace" font-size="16" xml:space="preserve">$ uv sync --dev</text>
<text x="32" y="252" fill="#cbd5e1" font-family="monospace" font-size="16" xml:space="preserve">Creating virtual environment at: .venv</text>
<text x="32" y="280" fill="#cbd5e1" font-family="monospace" font-size="16" xml:space="preserve">Resolved 28 packages in 308ms</text>
<text x="32" y="308" fill="#cbd5e1" font-family="monospace" font-size="16" xml:space="preserve">Installed 26 packages in 41ms</text>
<text x="32" y="336" fill="#94a3b8" font-family="monospace" font-size="16" xml:space="preserve">[Installation output excerpt; package details omitted]</text>
<text x="32" y="364" fill="#cbd5e1" font-family="monospace" font-size="16" xml:space="preserve"></text>
<text x="32" y="392" fill="#f8fafc" font-family="monospace" font-size="16" xml:space="preserve">$ uv run ruff check .</text>
<text x="32" y="420" fill="#86efac" font-family="monospace" font-size="16" xml:space="preserve">All checks passed!</text>
<text x="32" y="448" fill="#cbd5e1" font-family="monospace" font-size="16" xml:space="preserve"></text>
<text x="32" y="476" fill="#f8fafc" font-family="monospace" font-size="16" xml:space="preserve">$ uv run ruff format --check .</text>
<text x="32" y="504" fill="#cbd5e1" font-family="monospace" font-size="16" xml:space="preserve">10 files already formatted</text>
<text x="32" y="532" fill="#cbd5e1" font-family="monospace" font-size="16" xml:space="preserve"></text>
<text x="32" y="560" fill="#f8fafc" font-family="monospace" font-size="16" xml:space="preserve">$ uv run pytest</text>
<text x="32" y="588" fill="#cbd5e1" font-family="monospace" font-size="16" xml:space="preserve">platform darwin -- Python 3.12.14, pytest-9.2.0, pluggy-1.7.0</text>
<text x="32" y="616" fill="#cbd5e1" font-family="monospace" font-size="16" xml:space="preserve">collected 4 items</text>
<text x="32" y="644" fill="#86efac" font-family="monospace" font-size="16" xml:space="preserve">tests/test_secret_scan.py .                                                      [ 25%]</text>
<text x="32" y="672" fill="#86efac" font-family="monospace" font-size="16" xml:space="preserve">tests/test_smoke.py ...                                                          [100%]</text>
<text x="32" y="700" fill="#86efac" font-family="monospace" font-size="16" xml:space="preserve">================================== 4 passed in 0.37s ===================================</text>
<path d="M32 734 H1068" stroke="#334155"/>
<text x="32" y="770" fill="#94a3b8" font-family="sans-serif" font-size="16">Engineering checks only — no live model call or model quality measurement.</text>
</svg>
