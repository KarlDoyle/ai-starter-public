[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rag-tool"
version = "0.1.0"
description = "Starter local RAG and source-backed Q&A tool."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "llama-index-core>=0.0.0"
]

[project.scripts]
rag-tool = "rag_tool.query:main"

# Dev toolchain — installed by `uv sync --dev`. ruff is the lint+format gate
# (biome's counterpart on the TS side); pytest is the test gate. See ruff.toml.
[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["src"]

