name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Sequential quality gates — cheapest, fastest signal first; each step only runs
# if the previous one passed. This is the same order the local pre-push hook
# runs, so "green here" means "green there". Adapted into a reusable sequential pipeline. Target: a fast, boring, always-the-same pipeline.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No `version:` here — package.json's packageManager field is the single source
      # of truth. action-setup v6 fails outright when both are set.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # 1. Types — fastest failure.
      - name: Typecheck
        run: pnpm typecheck

      # 2. Lint + format check (biome).
      - name: Lint
        run: pnpm lint

      # 3. Tests — unit + the secret-scan boundary test.
      - name: Test
        run: pnpm test

      # 4. Build last — the most expensive step.
      - name: Build
        run: pnpm build

      # Optional, project-opt-in extras (not wired here — add a step like these
      # once the project has the underlying script):
      #   - Size ratchet: budget the *shipped runtime JS* only — sourcemaps and
      #     `.d.ts` are dev artefacts and shouldn't count against the payload
      #     budget. See the project's own size-check script.
      #   - e2e-smoke-against-dist: for CLI products, smoke-test the *built*
      #     binary (not the TS sources) as its own job after Build — it's the
      #     only gate that proves the thing you ship actually runs. See
      #     the project's own built-artifact smoke script.
